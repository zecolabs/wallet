[package]
name = "libcrypto"
version = "0.1.0"
edition = "2021"
description = "Keccak-256, Ed25519 and encrypted keystore for the Zeco wallet CLI python3"
license = "MIT OR Apache-2.0"

[lib]
name = "_libcrypto"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
ed25519-dalek = "2"
tiny-keccak = { version = "2", features = ["keccak"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
pyo3 = { version = "0.22", features = ["abi3-py38"], optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.test]
opt-level = 3
