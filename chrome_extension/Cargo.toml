[package]
name = "libcrypto"
version = "0.1.0"
edition = "2021"
description = "Keccak-256, Ed25519 for the Zeco wallet chrome extension"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
bip39 = { version = "2.0", features = ["rand"] }
ed25519-dalek = "2.1"
hmac = "0.12"
sha2 = "0.10"
tiny-keccak = { version = "2.0", features = ["keccak"] }
js-sys = "0.3"
hex = "0.4"
zeroize = { version = "1.7", features = ["derive"] }
getrandom = { version = "0.2", features = ["js"] }

[dependencies.console_error_panic_hook]
version = "0.1"
optional = true

[features]
default = ["console_error_panic_hook"]

[profile.release]
opt-level = 3
lto = true
