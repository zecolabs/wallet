name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run Id"
        required: true
        type: string
      target:
        description: "Target"
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      id-token: write
      actions: read
    steps:
      - name: Download wheels + sdist from the build run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true

      - name: List files to upload
        run: ls -l dist

      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
